<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SignSync — Camera Permission</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 480px;
        margin: 64px auto;
        padding: 0 24px;
        color: #1e293b;
      }
      h1 {
        font-size: 1.25rem;
      }
      button {
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 0.95rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        margin-top: 16px;
        font-size: 0.9rem;
        color: #475569;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1 id="heading">SignSync needs camera access</h1>
    <p id="description">
      Gesture Recognition uses your camera to detect hand gestures locally in
      your browser. Nothing is uploaded.
    </p>
    <button id="grant" type="button">Grant camera access</button>
    <div id="status"></div>
    <script type="module" src="/src/permission/permission.ts"></script>
  </body>
</html>
